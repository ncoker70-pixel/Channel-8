<title>Channel 8</title>

<style>
/* Layout: one column. Pixel HUD, a 192x112 pixel-art stage scaled up, and a text box with a numbered menu under it.
   Look: Dragon Quest windows (black, white rounded border) with Oregon Trail menus. */
:root {
  --screen: #000000;
  --line: #fcfcfc;
  --dim: #7c7c7c;
  --text: #fcfcfc;
  --gold: #f8d878;      /* highlights, cursor */
  --orange: #fc9838;    /* accent */
  --green: #58d854;
  --red: #f83800;
  --blue: #3cbcfc;
  --pixel: "Press Start 2P", "Courier New", monospace;
  --read: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html { min-height: 100%; }
body { min-height: 100%; margin: 0; background: var(--screen); color: var(--text); font-family: var(--read); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 24px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }

/* HUD */
.hud { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-family: var(--pixel); font-size: 9px; letter-spacing: .02em; background: #000; border: 3px solid var(--line); border-radius: 8px; padding: 10px 10px 8px; }
.hud[hidden] { display: none; }
.meter { display: grid; grid-template-columns: 30px 1fr 26px; align-items: center; gap: 5px; min-width: 0; }
.meter em { font-style: normal; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
.tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--text); }
.tick.bad { background: var(--red); } .tick.good { background: var(--green); }
.meter span { color: var(--gold); }
.blocks { height: 10px; border: 2px solid var(--line); padding: 1px; background: #000; position: relative; }
.blocks i { display: block; height: 100%;
  background-image: repeating-linear-gradient(to right, var(--c) 0 6px, transparent 6px 8px); transition: width .3s steps(6); }
.blocks.nrg { --c: var(--green); } .blocks.nrg.low { --c: var(--red); }
.blocks.rep { --c: var(--orange); }
.blocks.xp { --c: var(--blue); }
.hudrow { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.clock { font-size: 14px; color: var(--text); font-variant-numeric: tabular-nums; }
.clock small { font-size: 8px; color: var(--dim); margin-left: 6px; }
.mute { font-family: var(--pixel); font-size: 8px; background: #000; color: var(--text); border: 2px solid var(--line); padding: 5px 6px; cursor: pointer; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; min-height: 0; }
.chip { font-family: var(--pixel); font-size: 7px; padding: 4px 5px; border: 2px solid var(--dim); border-radius: 4px; color: var(--text); background: #000; line-height: 1; }
.chip.bad { border-color: var(--red); color: var(--red); }
.chip.perk { border-color: var(--blue); color: var(--blue); }

/* stage */
.stage { position: relative; border: 3px solid var(--line); border-radius: 8px; box-shadow: 0 0 0 3px #000; background: #000; overflow: hidden; transition: transform 1s ease-in-out; z-index: 1; }   /* above the box while it glides up past it */
canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; aspect-ratio: 192 / 112; }

/* dialogue box */
.box { position: relative; background: #000; border: 3px solid var(--line); border-radius: 8px; box-shadow: 0 0 0 3px #000; padding: 18px 16px 14px; min-height: 120px; cursor: pointer; }
.tag { position: absolute; top: -12px; left: 12px; background: #000; border: 0; font-family: var(--pixel); font-size: 9px; padding: 3px 8px; color: var(--text); max-width: calc(100% - 40px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.text { font-size: 23px; line-height: 1.12; min-height: 2.3em; white-space: pre-wrap; max-width: 60ch; }
.more { position: absolute; right: 14px; bottom: 8px; font-family: var(--pixel); font-size: 10px; color: var(--gold); animation: blink .8s steps(2) infinite; }
.more[hidden] { display: none; }
@keyframes blink { 50% { opacity: 0; } }
/* the title: no dialogue frame, just the buttons under the picture. The cold open hides the box entirely so the picture sits alone in the middle of the screen. */
.box.bare { border-color: transparent; box-shadow: none; cursor: default; min-height: 0; padding-top: 0; }
.box.bare .text { min-height: 0; }
.box.away { visibility: hidden; }
.fx { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.fx span { font-family: var(--pixel); font-size: 8px; padding: 4px 5px; border: 2px solid currentColor; }
.fx .up { color: var(--green); } .fx .down { color: var(--red); } .fx .neu { color: var(--dim); }

.menu { display: grid; gap: 4px; margin-top: 10px; cursor: default; }
.menu:empty { display: none; }
.opt { display: grid; grid-template-columns: 18px 1fr; align-items: start; text-align: left; background: transparent; border: 0; color: var(--text); font-family: var(--read); font-size: 22px; line-height: 1.05; padding: 6px 4px; cursor: pointer; }
.opt::before { content: "▶"; font-family: var(--pixel); font-size: 9px; color: transparent; padding-top: 5px; }
.opt:hover::before, .opt:focus-visible::before, .opt.sel::before { color: var(--text); }
.opt:focus-visible { outline: 0; }
.opt .n { color: var(--text); margin-right: 8px; font-weight: normal; }
.opt small { display: block; font-size: 17px; color: #9c9c9c; margin-top: 2px; }
.opt small.need { color: var(--red); } .opt small.clamp { color: var(--blue); }
.opt:disabled { color: #4a4a4a; cursor: not-allowed; } .opt:disabled:hover { color: #4a4a4a; } .opt:disabled::before { color: transparent !important; }
.opt .ck { font-family: var(--pixel); font-size: 10px; color: var(--green); margin-right: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 8px; }
.grid2 .opt { font-size: 19px; padding: 4px 2px; }
.grid2 .opt small { font-size: 15px; }
.btn { font-family: var(--pixel); font-size: 11px; background: #000; color: var(--text); border: 3px solid var(--line); border-radius: 6px; padding: 12px 16px; cursor: pointer; justify-self: start; margin: 8px 5px 5px; }
.btn:hover:not(:disabled), .btn:focus-visible { background: var(--text); color: #000; outline: 0; }
.lbl { font-family: var(--pixel); font-size: 8px; color: var(--gold); margin: 8px 0 4px; }
.fbtags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; } .fbt { cursor: pointer; font-family: var(--pixel); } .fbt.on { background: var(--gold); color: #000; border-color: var(--gold); }
.fbta { max-width: 100%; font-size: 18px; resize: vertical; margin-bottom: 8px; }
.name { font-family: var(--read); font-size: 24px; background: #000; color: var(--text); border: 3px solid var(--line); padding: 4px 8px; width: 100%; box-sizing: border-box; max-width: 320px; }
.name:focus { outline: 3px solid var(--gold); }

/* mini-games */
.gauge { position: relative; height: 34px; border: 3px solid var(--line); background: #1c1c3c; margin: 12px 0 8px; overflow: hidden; }
.gauge .zone { position: absolute; top: 0; bottom: 0; background: var(--green); }
.gauge .needle { position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: var(--red); box-shadow: 0 0 0 2px #000; }
.pips { display: flex; gap: 6px; align-items: center; font-family: var(--pixel); font-size: 8px; color: var(--dim); }
.pips i { width: 12px; height: 12px; border: 2px solid var(--line); display: block; }
.pips i.hit { background: var(--green); } .pips i.miss { background: var(--red); }
.vial { position: relative; height: 30px; border: 3px solid var(--line); background: #88d848; margin: 12px 0 8px; overflow: hidden; }
.vial .mark { position: absolute; top: 0; bottom: 0; width: 3px; background: #000; }
.vial .zone { position: absolute; top: 0; bottom: 0; background: rgba(252,252,252,.35); }
.vial .bubble { position: absolute; top: 6px; width: 22px; height: 12px; margin-left: -11px; background: #fcfcfc; box-shadow: 0 0 0 2px #000; }
.vial .bubble.in { background: var(--gold); }
.bar2 { height: 10px; border: 2px solid var(--line); background: #000; margin: 4px 0; }
.bar2 i { display: block; height: 100%; background: var(--green); }
.bar2.time i { background: var(--gold); }
.minibtns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.minibtns .btn { justify-self: stretch; touch-action: manipulation; }

/* coffee mug */
.mugrow { display: flex; justify-content: center; margin: 12px 0 6px; }
.mug { position: relative; width: 64px; height: 84px; border: 4px solid var(--line); border-top: 0; background: #000; margin-right: 22px; }
.mug::after { content: ""; position: absolute; right: -24px; top: 16px; width: 14px; height: 34px; border: 4px solid var(--line); border-left: 0; }
.mug i { position: absolute; left: 0; right: 0; bottom: 0; background: #503000; }
.mug i::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: #7c4c00; }
.mug b { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--green); border-bottom: 2px dashed var(--green); background: rgba(88,216,84,.18); }
.mug.spill { border-color: var(--red); }

/* mini-game buttons and readouts */
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.grid4 .btn { justify-self: stretch; margin: 5px; font-size: 10px; padding: 16px 8px; touch-action: manipulation; }
.btn.big { justify-self: stretch; font-size: 16px; padding: 22px 12px; touch-action: manipulation; }
.btn.hold { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.bar2.lift i { background: var(--orange); } .bar2.lift.danger i { background: var(--red); }
.item { font-family: var(--pixel); font-size: 14px; color: var(--gold); text-align: center; margin: 10px 0 4px; line-height: 1.4; }
.score { font-family: var(--pixel); font-size: 8px; color: var(--dim); text-align: center; }
.title-screen { display: grid; justify-items: center; gap: 6px; }

.btn.lit { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 0 16px var(--gold); }
.gh { font-family: var(--pixel); font-size: 8px; color: var(--dim); margin: 10px 0 2px; grid-column: 1 / -1; }

.sheet .sh { font-family: var(--pixel); font-size: 9px; color: var(--gold); margin-bottom: 2px; }

.credits { position: relative; height: 62vh; overflow: hidden; background: #000; border: 3px solid var(--line); border-radius: 6px; }

/* the trail */
.ot { width: 100%; border-collapse: collapse; font-family: var(--read); font-size: 20px; color: var(--text); line-height: 1.05; }
.ot td { padding: 1px 0; vertical-align: top; }

.ot td:first-child::after { content: ":"; }
.ot .good { color: var(--green); } .ot .fair { color: var(--gold); } .ot .poor { color: var(--orange); } .ot .bad { color: var(--red); }

.tug { position: relative; height: 16px; border: 3px solid var(--line); background: linear-gradient(90deg, var(--green) 0 50%, var(--red) 50% 100%); margin: 6px 0 4px; }
.tug b { position: absolute; top: -5px; width: 10px; height: 20px; margin-left: -5px; background: var(--gold); box-shadow: 0 0 0 2px #000; transition: left .3s steps(4); }

.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.grid3 .btn { justify-self: stretch; margin: 4px; font-size: 8px; padding: 16px 2px; line-height: 1.5; touch-action: manipulation; }

.tc { width: 100%; border-collapse: collapse; font-family: var(--read); font-size: 20px; color: var(--text); margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
.tc td { padding: 3px 0; border-bottom: 2px dotted #3c3c3c; }
.tc td:last-child { text-align: right; }

.small { font-size: 18px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { .more, .title-screen .btn, .title-screen.fade { animation: none; } .stage { transition: none; } .blocks i { transition: none; } .credits { height: auto; } .credits .roll { animation: none; position: static; } }
</style>
